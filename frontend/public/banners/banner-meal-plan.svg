<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280" fill="none">
  <defs>
    <linearGradient id="mp_bg" x1="0" y1="0" x2="280" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f291e"/>
      <stop offset="55%" stop-color="#111c18"/>
      <stop offset="100%" stop-color="#0a120f"/>
    </linearGradient>
    <radialGradient id="mp_glow" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#30d158" stop-opacity="0.38"/>
      <stop offset="65%" stop-color="#a3e635" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0a120f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mp_bowl" x1="60" y1="80" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2c3531"/>
      <stop offset="100%" stop-color="#141917"/>
    </linearGradient>
    <linearGradient id="mp_salmon" x1="100" y1="100" x2="170" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff8a65"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="mp_ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#30d158"/>
    </linearGradient>
  </defs>

  <rect width="280" height="280" rx="28" fill="url(#mp_bg)"/>
  <circle cx="140" cy="130" r="126" fill="url(#mp_glow)"/>

  <!-- Top USDA Seal -->
  <g transform="translate(16 14)">
    <rect width="128" height="24" rx="12" fill="#0d1f16" stroke="#30d158" stroke-opacity="0.55"/>
    <circle cx="13" cy="12" r="5" fill="#a3e635"/>
    <text x="24" y="16" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="800" fill="#d9f99d" letter-spacing="0.6">USDA MACRO PRO</text>
  </g>

  <!-- Gourmet Fitness Bowl -->
  <circle cx="138" cy="142" r="78" fill="#090e0c" opacity="0.7"/>
  <circle cx="138" cy="136" r="76" fill="url(#mp_bowl)" stroke="#3f4d46" stroke-width="2.5"/>
  <circle cx="138" cy="136" r="64" fill="#17201c"/>

  <!-- Brown Rice / Quinoa Quadrant -->
  <path d="M138 74 A62 62 0 0 0 78 136 L138 136 Z" fill="#d4b483" opacity="0.92"/>
  <circle cx="110" cy="112" r="2.2" fill="#f3dfc1"/>
  <circle cx="122" cy="96" r="2" fill="#b8935c"/>
  <circle cx="96" cy="124" r="2.2" fill="#f3dfc1"/>
  <circle cx="125" cy="120" r="1.8" fill="#b8935c"/>

  <!-- Fresh Broccoli & Spinach -->
  <g fill="#22c55e">
    <circle cx="102" cy="160" r="13" fill="#15803d"/>
    <circle cx="116" cy="174" r="12" fill="#16a34a"/>
    <circle cx="96" cy="148" r="10" fill="#22c55e"/>
    <circle cx="126" cy="162" r="10" fill="#4ade80"/>
    <circle cx="108" cy="166" r="6" fill="#86efac" opacity="0.5"/>
  </g>

  <!-- Sliced Avocado -->
  <g transform="translate(142 146)">
    <path d="M0 10 C18 0 42 4 46 22 C44 38 20 44 4 32 Z" fill="#4d7c0f"/>
    <path d="M4 12 C18 4 38 7 40 21 C38 33 19 37 7 28 Z" fill="#bef264"/>
    <ellipse cx="22" cy="21" rx="7" ry="6" fill="#78350f"/>
  </g>

  <!-- Grilled Salmon / Chicken Protein Fillet -->
  <g transform="translate(132 82)">
    <rect x="6" y="4" width="60" height="40" rx="14" transform="rotate(14 36 24)" fill="url(#mp_salmon)"/>
    <path d="M16 14 L52 24 M14 23 L50 33 M18 32 L46 39" stroke="#ffedd5" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Soft-boiled Egg -->
  <g transform="translate(148 134)">
    <ellipse cx="0" cy="0" rx="16" ry="13" fill="#f8fafc"/>
    <circle cx="0" cy="0" r="7.5" fill="#f59e0b"/>
    <circle cx="-2" cy="-2" r="2.2" fill="#fde68a" opacity="0.8"/>
  </g>

  <!-- Floating Macro Ring Card (Bottom) -->
  <g transform="translate(16 212)">
    <rect width="248" height="52" rx="14" fill="#101815" fill-opacity="0.92" stroke="#30d158" stroke-opacity="0.45"/>
    <circle cx="32" cy="26" r="16" fill="none" stroke="#24332c" stroke-width="5"/>
    <circle cx="32" cy="26" r="16" fill="none" stroke="url(#mp_ring)" stroke-width="5" stroke-dasharray="84 100" stroke-linecap="round" transform="rotate(-90 32 26)"/>
    <text x="32" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9.5" font-weight="800" fill="#ffffff">92%</text>
    <text x="60" y="23" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#ffffff">2,150 kcal · TDEE</text>
    <text x="60" y="40" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#86efac">160g P · 215g C · 68g F</text>
  </g>
</svg>
