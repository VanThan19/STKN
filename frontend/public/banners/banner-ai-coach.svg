<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280" fill="none">
  <defs>
    <linearGradient id="ai_bg" x1="0" y1="0" x2="280" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1136"/>
      <stop offset="55%" stop-color="#141326"/>
      <stop offset="100%" stop-color="#0b0b14"/>
    </linearGradient>
    <radialGradient id="ai_glow" cx="50%" cy="46%" r="54%">
      <stop offset="0%" stop-color="#bf5af2" stop-opacity="0.4"/>
      <stop offset="65%" stop-color="#30d158" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0b0b14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ai_line" x1="36" y1="138" x2="244" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#bf5af2"/>
      <stop offset="100%" stop-color="#30d158"/>
    </linearGradient>
  </defs>

  <rect width="280" height="280" rx="28" fill="url(#ai_bg)"/>
  <circle cx="140" cy="128" r="126" fill="url(#ai_glow)"/>

  <!-- Header Badge -->
  <g transform="translate(16 14)">
    <rect width="144" height="24" rx="12" fill="#271742" stroke="#bf5af2" stroke-opacity="0.6"/>
    <path d="M16 7 L18 11 L22 13 L18 15 L16 19 L14 15 L10 13 L14 11 Z" fill="#e9d5ff"/>
    <text x="28" y="16" font-family="system-ui,sans-serif" font-size="10" font-weight="800" fill="#f3e8ff" letter-spacing="0.5">GEMINI AI COACH LIVE</text>
  </g>

  <!-- Central Glass Dashboard Card -->
  <g transform="translate(20 50)">
    <rect width="240" height="122" rx="18" fill="#171529" fill-opacity="0.92" stroke="#a855f7" stroke-opacity="0.45"/>
    <text x="16" y="24" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#c4b5fd">AI Phân tích Tập &amp; Dinh dưỡng</text>
    <text x="224" y="24" text-anchor="end" font-family="system-ui,sans-serif" font-size="11" font-weight="800" fill="#4ade80">+18% tuần</text>

    <!-- Chart Grid -->
    <path d="M16 44 H224 M16 68 H224 M16 92 H224" stroke="#ffffff" stroke-opacity="0.07" stroke-dasharray="3 3"/>
    <!-- Trend Line -->
    <path d="M18 96 C46 92 66 72 96 74 C126 76 146 52 178 46 C198 42 212 36 224 32" stroke="url(#ai_line)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="96" cy="74" r="5" fill="#bf5af2" stroke="#ffffff" stroke-width="2"/>
    <circle cx="178" cy="46" r="5" fill="#30d158" stroke="#ffffff" stroke-width="2"/>
    <circle cx="224" cy="32" r="6" fill="#a3e635" stroke="#ffffff" stroke-width="2"/>

    <text x="16" y="110" font-family="system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#9ca3af">T2</text>
    <text x="68" y="110" font-family="system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#9ca3af">T4</text>
    <text x="122" y="110" font-family="system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#9ca3af">T6</text>
    <text x="176" y="110" font-family="system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#9ca3af">CN</text>
    <text x="224" y="110" text-anchor="end" font-family="system-ui,sans-serif" font-size="9.5" font-weight="800" fill="#a3e635">Đạt KPI</text>
  </g>

  <!-- Two Action Chips Below -->
  <g transform="translate(20 184)">
    <rect width="240" height="36" rx="11" fill="#1b1830" stroke="#30d158" stroke-opacity="0.5"/>
    <circle cx="20" cy="18" r="8" fill="#30d158"/>
    <path d="M16.5 18 L19 20.5 L23.5 15.5" stroke="#052e16" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="36" y="22" font-family="system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">Đã tạo Thực đơn 7 ngày + Nhắc bữa</text>
  </g>
  <g transform="translate(20 228)">
    <rect width="240" height="36" rx="11" fill="#1b1830" stroke="#bf5af2" stroke-opacity="0.5"/>
    <circle cx="20" cy="18" r="8" fill="#bf5af2"/>
    <path d="M16.5 18 L19 20.5 L23.5 15.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="36" y="22" font-family="system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#e9d5ff">Tự chỉnh Lịch tập &amp; Nhịp hồi phục</text>
  </g>
</svg>
